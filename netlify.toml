# Netlify: la web (flutter build web) y el servicio puente TicketBAI
[build]
  publish = "build/web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Toda la web: no se puede meter dentro de otra página (cobrar, anular o cerrar caja con un clic
# engañado) y el navegador no adivina tipos de fichero ni da permisos de cámara, micro o ubicación.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
